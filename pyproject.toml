[project]
name = "git-semver"
description = "Config-driven semantic versioning for git repos"
requires-python = ">=3.10"
dependencies = []
dynamic = ["version"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.coverage.run]
include = ["git-semver"]

[tool.coverage.report]
show_missing = true
skip_empty = true
